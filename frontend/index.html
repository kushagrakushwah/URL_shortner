<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener - Fast & Simple</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50px, -50px); }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 550px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            color: #2d3748;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #718096;
            font-size: 15px;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="text"]::placeholder {
            color: #a0aec0;
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .result-box {
            margin-top: 30px;
            padding: 0;
            background: transparent;
            border-radius: 12px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
            max-height: 0;
            overflow: hidden;
        }

        .result-box.show {
            opacity: 1;
            transform: translateY(0);
            max-height: 300px;
        }

        .result-content {
            padding: 25px;
            background: #f7fafc;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
        }

        .result-box.success .result-content {
            background: linear-gradient(135deg, #d4f4e2 0%, #e0f7ed 100%);
            border-color: #48bb78;
        }

        .result-box.error .result-content {
            background: linear-gradient(135deg, #fed7d7 0%, #fee5e5 100%);
            border-color: #f56565;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .result-icon {
            font-size: 24px;
        }

        .result-title {
            font-weight: 600;
            font-size: 16px;
            color: #2d3748;
        }

        .short-url-wrapper {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .url-label {
            font-size: 12px;
            color: #718096;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .short-url {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .short-url a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            flex: 1;
            word-break: break-all;
        }

        .short-url a:hover {
            text-decoration: underline;
        }

        .copy-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .copy-btn:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .copy-btn.copied {
            background: #48bb78;
        }

        .loading {
            text-align: center;
            color: #667eea;
            padding: 20px;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stats {
            margin-top: 20px;
            padding: 15px;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            color: #4a5568;
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 25px;
            }

            h1 {
                font-size: 26px;
            }

            .short-url {
                flex-direction: column;
                align-items: stretch;
            }

            .copy-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🔗</div>
            <h1>Kushwah's URL Shortener</h1>
            <p class="subtitle">Make your long URLs short and shareable in seconds</p>
        </div>
        
        <div class="input-wrapper">
            <input 
                type="text" 
                id="urlInput" 
                placeholder="Paste your long URL here..."
                autocomplete="off"
            >
        </div>
        
        <button id="shortenBtn">Shorten URL</button>
        
        <div id="resultBox" class="result-box"></div>

        <div class="stats">
            ⚡ Lightning fast • 🔒 Secure • 💯 Free forever
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/shorten";
        
        const urlInput = document.getElementById("urlInput");
        const shortenBtn = document.getElementById("shortenBtn");
        const resultBox = document.getElementById("resultBox");

        // Allow Enter key to submit
        urlInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                shortenBtn.click();
            }
        });

        shortenBtn.addEventListener("click", async () => {
            const longUrl = urlInput.value.trim();

            if (!longUrl) {
                showResult(`
                    <div class="result-header">
                        <span class="result-icon">⚠️</span>
                        <span class="result-title">Please enter a URL</span>
                    </div>
                `, "error");
                return;
            }

            // Show loading state
            shortenBtn.disabled = true;
            shortenBtn.textContent = "Shortening...";
            showResult(`
                <div class="loading">
                    <div class="spinner"></div>
                    <div>Creating your short link...</div>
                </div>
            `, "");

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({ url: longUrl })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Failed to shorten URL");
                }

                // Show success result
                const resultHTML = `
                    <div class="result-header">
                        <span class="result-icon">✅</span>
                        <span class="result-title">URL Shortened Successfully!</span>
                    </div>
                    <div class="short-url-wrapper">
                        <div class="url-label">Your Short URL</div>
                        <div class="short-url">
                            <a href="${data.short_url}" target="_blank" id="shortLink">${data.short_url}</a>
                            <button class="copy-btn" onclick="copyToClipboard('${data.short_url}', event)">Copy</button>
                        </div>
                    </div>
                `;
                
                showResult(resultHTML, "success");

            } catch (error) {
                showResult(`
                    <div class="result-header">
                        <span class="result-icon">❌</span>
                        <span class="result-title">Error</span>
                    </div>
                    <div style="color: #e53e3e; margin-top: 10px;">
                        ${error.message}<br>
                        <small>Make sure the backend is running on port 8000</small>
                    </div>
                `, "error");
            } finally {
                shortenBtn.disabled = false;
                shortenBtn.textContent = "Shorten URL";
            }
        });

        function showResult(html, type) {
            resultBox.innerHTML = `<div class="result-content">${html}</div>`;
            resultBox.className = "result-box";
            
            // Trigger animation
            setTimeout(() => {
                resultBox.className = "result-box show " + type;
            }, 10);
        }

        function copyToClipboard(text, event) {
            const btn = event.target;
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.textContent;
                btn.textContent = "Copied!";
                btn.classList.add("copied");
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove("copied");
                }, 2000);
            }).catch(() => {
                alert("Failed to copy. Please copy manually.");
            });
        }
    </script>
</body>
</html>
